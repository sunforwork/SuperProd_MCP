{{define "login"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理登录 · Super Productivity</title><link rel="stylesheet" href="/assets/ui/style.css"><script src="/assets/ui/auth.js" defer></script></head><body class="auth-page"><main class="auth-card"><div class="brand-mark">S</div><p class="eyebrow">SUPER PRODUCTIVITY</p><h1>管理你的同步空间</h1><p class="muted">用户、连接配置与存储用量，一处管理。</p>{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/admin/login"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>管理员账号<input name="username" autocomplete="username" value="{{.Username}}" required></label><label>密码<span class="password-field"><input id="password" name="password" type="password" aria-label="密码" autocomplete="current-password" required><button type="button" class="reveal" data-reveal="password" aria-label="显示密码">显示</button></span></label><button class="primary wide" type="submit">登录管理面板</button></form><p class="footnote">管理权限与个人同步账号分别验证。</p></main></body></html>{{end}}

{{define "oauth"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接授权 · Super Productivity</title><link rel="stylesheet" href="/assets/ui/style.css"><script src="/assets/ui/auth.js" defer></script></head><body class="auth-page"><main class="auth-card"><div class="brand-mark">S</div><p class="eyebrow">SUPER PRODUCTIVITY</p><h1>连接你的任务空间</h1><p class="muted">授权此连接读取任务，并使用当前开放的编辑工具。</p><div class="grant"><span class="badge">{{.Name}}</span><p><strong>连接客户端</strong><span class="break">{{.Client}}</span></p><p><strong>返回地址</strong><span class="break">{{.Redirect}}</span></p><p><strong>授权范围</strong><span>{{.Scope}}</span></p></div>{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/oauth/authorize"><input type="hidden" name="request_id" value="{{.ID}}"><input type="hidden" name="account_id" value="{{.AccountID}}"><label>用户名<input name="username" autocomplete="username" value="{{.Username}}" required></label><label>授权密码<span class="password-field"><input name="password" id="password" type="password" aria-label="授权密码" autocomplete="current-password" required><button type="button" class="reveal" data-reveal="password" aria-label="显示密码">显示</button></span></label><div class="actions"><button name="decision" value="deny" class="secondary" formnovalidate>取消</button><button name="decision" value="allow" class="primary">登录并授权</button></div></form><p class="footnote">{{.PasswordHelp}}</p></main></body></html>{{end}}
